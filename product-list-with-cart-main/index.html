<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Browse our delicious desserts collection and order your favorites. Features an interactive shopping cart with real-time updates."
    />
    <meta
      name="keywords"
      content="desserts, shopping cart, online ordering, pastries, cakes, food delivery"
    />
    <meta name="author" content="Franzy" />

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Desserts - Product List with Cart" />
    <meta
      property="og:description"
      content="Browse our delicious desserts collection and order your favorites with our interactive shopping cart."
    />
    <meta property="og:image" content="./preview.jpg" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Desserts - Product List with Cart" />
    <meta
      name="twitter:description"
      content="Browse our delicious desserts collection and order your favorites with our interactive shopping cart."
    />
    <meta name="twitter:image" content="./preview.jpg" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="app.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Desserts - Product List with Cart | Frontend Mentor</title>
  </head>
  <body>
    <main class="container">
      <!-- Products Section -->
      <section class="products-section">
        <h1 class="products-title">Desserts</h1>
       
          <div id="products-grid">
            <!-- Products will be dynamically inserted here with javascript  -->
          </div>
      </section>

      <!-- Cart Section at the right -->
      <aside class="cart-section" aria-label="Shopping cart">
        <div class="cart">
          <h2 class="cart-title">
            Your Cart (<span id="cart-count" aria-live="polite">0</span>)
          </h2>

          <!-- Empty Cart Message -->
          <div id="empty-cart" class="empty-cart" aria-live="polite">
            <img
              src="./assets/images/illustration-empty-cart.svg"
              alt=""
              role="presentation"
            />
            <p>Your added items will appear here</p>
          </div>

          <!-- Cart Items container-->
          <div
            id="cart-items"
            class="cart-items"
            style="display: none"
            role="list"
            aria-label="Cart items"
          >
            <!-- Cart items will be dynamically inserted here with javascript -->
          </div>

          <!-- Order total (hidden initially) -->
          <div id="order-total" class="order-total" style="display: none">
            <div class="total-row">
              <span>Order Total</span>
              <span id="total-price" class="total-price" aria-live="polite"
                >$0.00</span
              >
            </div>

            <div class="carbon-neutral" role="note">
              <img
                src="./assets/images/icon-carbon-neutral.svg"
                alt=""
                role="presentation"
              />
              <p>This is a <strong>carbon-neutral</strong> delivery</p>
            </div>
            <button
              id="confirm-order-btn"
              class="confirm-btn"
              aria-label="Confirm your order"
            >
              Confirm Order
            </button>
          </div>
        </div>
      </aside>
    </main>
    <!-- Order Confirmation Modal (hidden initially) -->
    <div
      id="order-modal"
      class="modal"
      style="display: none"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
    >
      <div class="modal-content">
        <img
          src="./assets/images/icon-order-confirmed.svg"
          alt=""
          role="presentation"
        />
        <h2 id="modal-title">Order Confirmed</h2>
        <p>We hope you enjoy your food!</p>

        <div
          id="modal-items"
          class="modal-items"
          role="list"
          aria-label="Order items"
        >
          <!-- Confirmed items will be inserted here -->
        </div>

        <div class="modal-total">
          <span>Order Total</span>
          <span id="modal-total-price">$0.00</span>
        </div>

        <button
          id="new-order-btn"
          class="new-order-btn"
          aria-label="Start a new order"
        >
          Start New Order
        </button>
      </div>
    </div>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Franzy</a>.
    </footer>
  </body>
</html>
